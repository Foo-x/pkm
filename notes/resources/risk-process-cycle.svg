<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" width="780" height="580" font-family="Noto Sans CJK JP, sans-serif">
  <rect x="0" y="0" width="780" height="580" fill="#ffffff"/>

  <text x="390" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">リスクマネジメントのプロセス</text>

  <defs>
    <marker id="rmArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="rmArrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- 計画（サイクルに入る前の準備） -->
  <rect x="330" y="55" width="120" height="50" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="390" y="85" text-anchor="middle" font-size="15" fill="#1f2937">計画</text>

  <line x1="390" y1="105" x2="390" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#rmArrow)"/>

  <!-- pentagon cycle nodes -->
  <rect x="330" y="205" width="120" height="50" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="390" y="235" text-anchor="middle" font-size="15" fill="#1f2937">特定</text>

  <rect x="473" y="309" width="120" height="50" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="533" y="339" text-anchor="middle" font-size="15" fill="#1f2937">分析</text>

  <rect x="418" y="476" width="120" height="50" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="478" y="506" text-anchor="middle" font-size="15" fill="#1f2937">対応計画</text>

  <rect x="242" y="476" width="120" height="50" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="302" y="506" text-anchor="middle" font-size="15" fill="#1f2937">実行</text>

  <rect x="187" y="309" width="120" height="50" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="247" y="339" text-anchor="middle" font-size="15" fill="#1f2937">監視</text>

  <!-- cycle arrows -->
  <line x1="442.6" y1="268.2" x2="480.4" y2="295.8" stroke="#475569" stroke-width="1.5" marker-end="url(#rmArrow)"/>
  <line x1="512.7" y1="395.7" x2="498.3" y2="439.3" stroke="#475569" stroke-width="1.5" marker-end="url(#rmArrow)"/>
  <line x1="413" y1="501" x2="367" y2="501" stroke="#475569" stroke-width="1.5" marker-end="url(#rmArrow)"/>
  <line x1="281.7" y1="439.3" x2="267.3" y2="395.7" stroke="#475569" stroke-width="1.5" marker-end="url(#rmArrow)"/>

  <!-- loop back: 監視 -> 特定 -->
  <line x1="299.6" y1="295.8" x2="337.4" y2="268.2" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#rmArrowAmber)"/>
  <text x="260" y="270" font-size="11" fill="#92400e">繰り返す</text>

  <!-- legend -->
  <rect x="40" y="540" width="700" height="34" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="390" y="562" text-anchor="middle" font-size="12" fill="#92400e">段階的詳細化により新たなリスクが見つかるため、監視から特定に戻って繰り返す</text>
</svg>
