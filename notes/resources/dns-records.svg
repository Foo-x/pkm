<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Noto Sans CJK JP, sans-serif">
  <rect x="0" y="0" width="900" height="660" fill="#ffffff"/>

  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">リソースレコードの参照関係（example.com ゾーン）</text>

  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <!-- forward zone box -->
  <rect x="40" y="60" width="480" height="466" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="48" y="52" font-size="13" fill="#64748b">example.comゾーン（正引き）</text>

  <g font-size="12" fill="#1f2937">
    <!-- row1 SOA -->
    <rect x="60" y="80" width="400" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="68" y="100">example.com</text>
    <rect x="180" y="83" width="55" height="24" rx="4" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="207" y="100" text-anchor="middle">SOA</text>
    <text x="245" y="100" font-size="11" fill="#475569">シリアル番号・再試行間隔など</text>

    <!-- row2 NS -->
    <rect x="60" y="124" width="400" height="30" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="68" y="144">example.com</text>
    <rect x="180" y="127" width="55" height="24" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="207" y="144" text-anchor="middle">NS</text>
    <text x="245" y="144" font-size="11" fill="#475569">ns1.example.com</text>

    <!-- row3 A (ns1) -->
    <rect x="60" y="168" width="400" height="30" rx="4" fill="#fffbeb" stroke="#d97706"/>
    <text x="68" y="188">ns1</text>
    <rect x="180" y="171" width="55" height="24" rx="4" fill="#fde68a" stroke="#d97706"/>
    <text x="207" y="188" text-anchor="middle">A</text>
    <text x="245" y="188" font-size="11" fill="#475569">192.0.2.53</text>

    <!-- row4 A (www) -->
    <rect x="60" y="212" width="400" height="30" rx="4" fill="#fffbeb" stroke="#d97706"/>
    <text x="68" y="232">www</text>
    <rect x="180" y="215" width="55" height="24" rx="4" fill="#fde68a" stroke="#d97706"/>
    <text x="207" y="232" text-anchor="middle">A</text>
    <text x="245" y="232" font-size="11" fill="#475569">192.0.2.1</text>

    <!-- row5 AAAA (www) -->
    <rect x="60" y="256" width="400" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="68" y="276">www</text>
    <rect x="180" y="259" width="55" height="24" rx="4" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="207" y="276" text-anchor="middle">AAAA</text>
    <text x="245" y="276" font-size="11" fill="#475569">2001:db8::1</text>

    <!-- row6 CNAME (blog) -->
    <rect x="60" y="300" width="400" height="30" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="68" y="320">blog</text>
    <rect x="180" y="303" width="55" height="24" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="207" y="320" text-anchor="middle">CNAME</text>
    <text x="245" y="320" font-size="11" fill="#475569">www.example.com</text>

    <!-- row7 A (mail) -->
    <rect x="60" y="344" width="400" height="30" rx="4" fill="#fffbeb" stroke="#d97706"/>
    <text x="68" y="364">mail</text>
    <rect x="180" y="347" width="55" height="24" rx="4" fill="#fde68a" stroke="#d97706"/>
    <text x="207" y="364" text-anchor="middle">A</text>
    <text x="245" y="364" font-size="11" fill="#475569">192.0.2.25</text>

    <!-- row8 MX -->
    <rect x="60" y="388" width="400" height="30" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="68" y="408">example.com</text>
    <rect x="180" y="391" width="55" height="24" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="207" y="408" text-anchor="middle">MX</text>
    <text x="245" y="408" font-size="11" fill="#475569">10 mail.example.com</text>

    <!-- row9 TXT -->
    <rect x="60" y="432" width="400" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="68" y="452">example.com</text>
    <rect x="180" y="435" width="55" height="24" rx="4" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="207" y="452" text-anchor="middle">TXT</text>
    <text x="245" y="452" font-size="11" fill="#475569">"v=spf1 ... -all"</text>

    <!-- row10 CAA -->
    <rect x="60" y="476" width="400" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="68" y="496">example.com</text>
    <rect x="180" y="479" width="55" height="24" rx="4" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="207" y="496" text-anchor="middle">CAA</text>
    <text x="245" y="496" font-size="11" fill="#475569">0 issue "letsencrypt.org"</text>
  </g>

  <!-- internal reference loops: NS -> ns1 A, CNAME -> www A, MX -> mail A -->
  <path d="M460,139 C495,139 495,183 460,183" fill="none" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#arrow3)"/>
  <path d="M460,315 C500,315 500,229 460,229" fill="none" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#arrow3)"/>
  <path d="M460,403 C495,403 495,359 460,359" fill="none" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#arrow3)"/>

  <!-- reverse zone box -->
  <rect x="690" y="140" width="190" height="110" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="698" y="132" font-size="13" fill="#64748b">逆引きゾーン</text>
  <rect x="704" y="160" width="162" height="70" rx="4" fill="#fdf2f8" stroke="#db2777"/>
  <text x="712" y="180" font-size="10" fill="#1f2937">1.2.0.192</text>
  <text x="712" y="193" font-size="10" fill="#1f2937">.in-addr.arpa</text>
  <rect x="712" y="198" width="36" height="20" rx="4" fill="#fce7f3" stroke="#db2777"/>
  <text x="730" y="212" text-anchor="middle" font-size="10">PTR</text>
  <text x="753" y="212" font-size="10" fill="#475569">www.example.com</text>

  <!-- forward/reverse direction arrows -->
  <line x1="460" y1="219" x2="690" y2="175" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow3)"/>
  <text x="545" y="186" font-size="11" fill="#334155">A: 名前 → IP</text>

  <line x1="690" y1="225" x2="460" y2="238" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow3)"/>
  <text x="545" y="254" font-size="11" fill="#334155">PTR: IP → 名前</text>

  <!-- parent (com) zone box holding the delegation and glue -->
  <rect x="560" y="300" width="310" height="132" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="568" y="292" font-size="13" fill="#64748b">comゾーン（親ゾーン）</text>

  <rect x="576" y="318" width="278" height="30" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="584" y="338" font-size="11" fill="#1f2937">example.com</text>
  <rect x="690" y="321" width="40" height="24" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="710" y="338" text-anchor="middle" font-size="12" fill="#1f2937">NS</text>
  <text x="738" y="338" font-size="11" fill="#475569">ns1.example.com</text>

  <rect x="576" y="358" width="278" height="30" rx="4" fill="#fffbeb" stroke="#b45309" stroke-dasharray="3 3"/>
  <text x="584" y="378" font-size="11" fill="#1f2937">ns1.example.com</text>
  <rect x="690" y="361" width="40" height="24" rx="4" fill="#fde68a" stroke="#d97706"/>
  <text x="710" y="378" text-anchor="middle" font-size="12" fill="#1f2937">A</text>
  <text x="738" y="378" font-size="11" fill="#475569">192.0.2.53</text>

  <text x="576" y="406" font-size="10" fill="#b45309">↑ グルーレコード（ns1のAを親ゾーンにも置いたもの）</text>
  <text x="576" y="420" font-size="10" fill="#b45309">委任先のNS名が子ゾーン内にあるため必要</text>

  <!-- legend -->
  <rect x="40" y="550" width="820" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="572" font-size="12" font-weight="bold" fill="#1f2937">凡例</text>
  <line x1="56" y1="585" x2="90" y2="585" stroke="#3b82f6" stroke-width="1.4" marker-end="url(#arrow3)"/>
  <text x="98" y="589" font-size="11" fill="#334155">NS / CNAME / MXが指す先のレコードを参照（例: blog → wwwのA、MX → mailのA）</text>
  <line x1="56" y1="605" x2="90" y2="605" stroke="#b45309" stroke-dasharray="3 3"/>
  <text x="98" y="609" font-size="11" fill="#334155">グルーレコード: 委任先のNS名が子ゾーン内にある場合に、親ゾーンがNSと併せて持つA/AAAA</text>
  <line x1="56" y1="625" x2="90" y2="625" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow3)"/>
  <text x="98" y="629" font-size="11" fill="#334155">A（正引き）とPTR（逆引き）は同じIPを扱うが、名前解決の向きが逆</text>
</svg>
