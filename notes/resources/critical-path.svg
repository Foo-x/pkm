<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320" font-family="Noto Sans CJK JP, sans-serif">
  <rect x="0" y="0" width="780" height="320" fill="#ffffff"/>

  <text x="390" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">クリティカルパス（タスクの依存関係）</text>

  <defs>
    <marker id="cpArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="cpArrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- edges: critical path (red, bold) -->
  <line x1="130" y1="150" x2="240" y2="90" stroke="#b91c1c" stroke-width="3" marker-end="url(#cpArrowRed)"/>
  <line x1="320" y1="90" x2="430" y2="90" stroke="#b91c1c" stroke-width="3" marker-end="url(#cpArrowRed)"/>
  <line x1="510" y1="90" x2="620" y2="150" stroke="#b91c1c" stroke-width="3" marker-end="url(#cpArrowRed)"/>

  <!-- edges: non-critical path (gray) -->
  <line x1="130" y1="150" x2="240" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#cpArrow)"/>
  <line x1="320" y1="220" x2="430" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#cpArrow)"/>
  <line x1="510" y1="220" x2="620" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#cpArrow)"/>

  <!-- start node -->
  <rect x="60" y="125" width="70" height="50" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="95" y="155" text-anchor="middle" font-size="14" fill="#1f2937">開始</text>

  <!-- critical path nodes -->
  <rect x="240" y="65" width="80" height="50" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="280" y="90" text-anchor="middle" font-size="13" fill="#1f2937">タスクA</text>
  <text x="280" y="106" text-anchor="middle" font-size="11" fill="#7f1d1d">5日</text>

  <rect x="430" y="65" width="80" height="50" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="470" y="90" text-anchor="middle" font-size="13" fill="#1f2937">タスクB</text>
  <text x="470" y="106" text-anchor="middle" font-size="11" fill="#7f1d1d">8日</text>

  <!-- non-critical path nodes -->
  <rect x="240" y="195" width="80" height="50" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="280" y="220" text-anchor="middle" font-size="13" fill="#1f2937">タスクC</text>
  <text x="280" y="236" text-anchor="middle" font-size="11" fill="#334155">3日</text>

  <rect x="430" y="195" width="80" height="50" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="470" y="220" text-anchor="middle" font-size="13" fill="#1f2937">タスクD</text>
  <text x="470" y="236" text-anchor="middle" font-size="11" fill="#334155">4日</text>

  <text x="355" y="285" text-anchor="middle" font-size="11" fill="#4338ca">フロート6日（遅れても全体に影響しない）</text>
  <line x1="240" y1="270" x2="510" y2="270" stroke="#a5b4fc" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- end node -->
  <rect x="620" y="125" width="70" height="50" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="655" y="155" text-anchor="middle" font-size="14" fill="#1f2937">終了</text>

  <text x="390" y="305" text-anchor="middle" font-size="12" fill="#7f1d1d">赤: クリティカルパス（開始→A→B→終了、計13日、全体の所要期間を決定）</text>
</svg>
