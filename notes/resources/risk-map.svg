<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="Noto Sans CJK JP, sans-serif">
  <rect x="0" y="0" width="640" height="470" fill="#ffffff"/>

  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">リスクマップ（発生確率×影響度）</text>

  <!-- quadrant backgrounds -->
  <rect x="90" y="60" width="250" height="180" fill="#fef3c7"/>
  <rect x="340" y="60" width="250" height="180" fill="#fee2e2"/>
  <rect x="90" y="240" width="250" height="180" fill="#dcfce7"/>
  <rect x="340" y="240" width="250" height="180" fill="#fef3c7"/>

  <!-- plot border and midlines -->
  <rect x="90" y="60" width="500" height="360" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="340" y1="60" x2="340" y2="420" stroke="#ffffff" stroke-width="2"/>
  <line x1="90" y1="240" x2="590" y2="240" stroke="#ffffff" stroke-width="2"/>

  <!-- quadrant captions -->
  <text x="215" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">低確率・高影響</text>
  <text x="215" y="108" text-anchor="middle" font-size="11" fill="#92400e">影響に備える</text>
  <text x="215" y="124" text-anchor="middle" font-size="10" fill="#92400e">脅威: 転嫁・コンティンジェンシープラン</text>
  <text x="215" y="138" text-anchor="middle" font-size="10" fill="#92400e">好機: 共有</text>

  <text x="465" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">高確率・高影響</text>
  <text x="465" y="108" text-anchor="middle" font-size="11" fill="#991b1b">最優先で対応</text>
  <text x="465" y="124" text-anchor="middle" font-size="10" fill="#991b1b">脅威: 回避・転嫁</text>
  <text x="465" y="138" text-anchor="middle" font-size="10" fill="#991b1b">好機: 活用・共有</text>

  <text x="215" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">低確率・低影響</text>
  <text x="215" y="288" text-anchor="middle" font-size="11" fill="#166534">受容</text>
  <text x="215" y="304" text-anchor="middle" font-size="10" fill="#166534">脅威・好機とも個別対応しない</text>

  <text x="465" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">高確率・低影響</text>
  <text x="465" y="288" text-anchor="middle" font-size="11" fill="#92400e">日常的に対応</text>
  <text x="465" y="304" text-anchor="middle" font-size="10" fill="#92400e">脅威: 軽減</text>
  <text x="465" y="318" text-anchor="middle" font-size="10" fill="#92400e">好機: 強化</text>

  <!-- axes -->
  <text x="90" y="435" font-size="12" fill="#334155">低</text>
  <text x="580" y="435" font-size="12" fill="#334155">高</text>
  <text x="335" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">発生確率</text>

  <text x="60" y="415" font-size="12" fill="#334155">低</text>
  <text x="60" y="70" font-size="12" fill="#334155">高</text>
  <text x="35" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937" transform="rotate(-90 35 240)">影響度</text>
</svg>
